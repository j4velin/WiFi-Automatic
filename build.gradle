plugins {
    id 'com.android.application' version '9.4.1'
    id 'org.sonarqube' version '7.5.0.8588'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "de.j4velin.wifiAutoOff"
        minSdk 23
        targetSdk 28 // see lint comment below
        versionCode 2000
        versionName "2.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        // targetSdk must stay at 28: apps targeting 29+ can no longer toggle WiFi via WifiManager
        disable 'ExtraTranslation', 'MissingTranslation', 'ExpiredTargetSdkVersion'
    }

    namespace 'de.j4velin.wifiAutoOff'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core:1.19.1'
}

def props = new Properties()

if (project.file("key.properties").exists()) {
    props.load(new FileInputStream(project.file("key.properties")))
} else {
    logger.warn('Using sample keystore!!')
    props.load(new FileInputStream(project.file("key.properties.sample")))
}

android.signingConfigs.release.storeFile project.file(props.keyStore)
android.signingConfigs.release.storePassword props.keyStorePassword
android.signingConfigs.release.keyAlias props.keyAlias
android.signingConfigs.release.keyPassword props.keyAliasPassword
